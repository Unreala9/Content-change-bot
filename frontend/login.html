<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up - Telegram Sync Hub</title>
    <!-- Google Fonts & FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0e11;
            --card-bg: rgba(30, 35, 41, 0.85);
            --border-color: #2b3139;
            --primary-yellow: #fcd535;
            --primary-yellow-hover: #f0b90b;
            --text-main: #eaecef;
            --text-muted: #707a8a;
            --accent-blue: #0088cc;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(252, 213, 53, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 136, 204, 0.08) 0%, transparent 40%);
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 32px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: rgba(252, 213, 53, 0.1);
            border: 1px solid rgba(252, 213, 53, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            color: var(--primary-yellow);
            font-size: 24px;
        }

        .brand-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--primary-yellow);
        }

        .brand-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Auth Tabs */
        .auth-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            background: transparent;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .auth-tab.active {
            background: var(--primary-yellow);
            color: #181a20;
            box-shadow: 0 2px 8px rgba(252, 213, 53, 0.2);
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            background: rgba(11, 14, 17, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--primary-yellow);
            box-shadow: 0 0 0 3px rgba(252, 213, 53, 0.15);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
        }

        .toggle-password:hover {
            color: var(--text-main);
        }

        /* Buttons */
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--primary-yellow);
            color: #181a20;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-yellow-hover);
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-demo {
            width: 100%;
            padding: 11px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-demo:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
        }

        /* Alerts */
        .alert-box {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }

        .alert-box.danger {
            display: block;
            background: rgba(246, 70, 93, 0.15);
            border: 1px solid rgba(246, 70, 93, 0.3);
            color: #ff6b7b;
        }

        .alert-box.success {
            display: block;
            background: rgba(14, 203, 129, 0.15);
            border: 1px solid rgba(14, 203, 129, 0.3);
            color: #20e098;
        }

        .alert-box.info {
            display: block;
            background: rgba(0, 136, 204, 0.15);
            border: 1px solid rgba(0, 136, 204, 0.3);
            color: #38bdf8;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Brand Header -->
        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <h1 class="brand-title">Telegram<span>Sync</span></h1>
            <p class="brand-subtitle">Multi-User Channel Sync & Automation Engine</p>
        </div>

        <!-- Auth Mode Switcher -->
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tabSignIn">Sign In</button>
            <button type="button" class="auth-tab" id="tabSignUp">Create Account</button>
        </div>

        <!-- Alert Notification Box -->
        <div id="authAlert" class="alert-box"></div>

        <!-- Auth Form -->
        <form id="authForm">
            <div class="form-group">
                <label for="emailInput" class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope left-icon"></i>
                    <input type="email" id="emailInput" class="form-input" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="passwordInput" class="form-label">Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock left-icon"></i>
                    <input type="password" id="passwordInput" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <i class="fa-solid fa-eye toggle-password" id="togglePasswordBtn"></i>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fa-solid fa-right-to-bracket"></i> <span id="submitBtnText">Sign In</span>
            </button>
        </form>

        <button type="button" class="btn-demo" id="btnContinueDemo">
            <i class="fa-solid fa-play"></i> Continue in Local Studio Mode
        </button>

        <div class="footer-note">
            Powered by Supabase Auth & Telethon StringSessions
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        function getApiUrl(path) {
            const baseUrl = (window.ENV && window.ENV.API_BASE_URL) ? window.ENV.API_BASE_URL.replace(/\/+$/, "") : "";
            return baseUrl + (path.startsWith("/") ? path : "/" + path);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const tabSignIn = document.getElementById("tabSignIn");
            const tabSignUp = document.getElementById("tabSignUp");
            const authForm = document.getElementById("authForm");
            const emailInput = document.getElementById("emailInput");
            const passwordInput = document.getElementById("passwordInput");
            const togglePasswordBtn = document.getElementById("togglePasswordBtn");
            const submitBtn = document.getElementById("submitBtn");
            const submitBtnText = document.getElementById("submitBtnText");
            const authAlert = document.getElementById("authAlert");
            const btnContinueDemo = document.getElementById("btnContinueDemo");

            let authMode = "signin";

            // Check if user is already logged in
            const existingToken = localStorage.getItem("sb_access_token");
            if (existingToken) {
                window.location.href = "index.html";
                return;
            }

            // Check backend status
            try {
                const statusRes = await fetch(getApiUrl("/api/status"));
                const statusData = await statusRes.json();
                if (!statusData.supabase_configured) {
                    showAlert("info", "💡 Supabase credentials missing in backend .env. You can use 'Local Studio Mode' below.");
                }
            } catch (err) {
                console.log("Status check notice:", err);
            }

            // Tab Switching
            tabSignIn.addEventListener("click", () => {
                authMode = "signin";
                tabSignIn.classList.add("active");
                tabSignUp.classList.remove("active");
                submitBtnText.textContent = "Sign In";
                submitBtn.querySelector("i").className = "fa-solid fa-right-to-bracket";
            });

            tabSignUp.addEventListener("click", () => {
                authMode = "signup";
                tabSignUp.classList.add("active");
                tabSignIn.classList.remove("active");
                submitBtnText.textContent = "Create Account";
                submitBtn.querySelector("i").className = "fa-solid fa-user-plus";
            });

            // Toggle Password Visibility
            togglePasswordBtn.addEventListener("click", () => {
                const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                passwordInput.setAttribute("type", type);
                togglePasswordBtn.className = type === "password" ? "fa-solid fa-eye toggle-password" : "fa-solid fa-eye-slash toggle-password";
            });

            function showAlert(type, message) {
                authAlert.className = `alert-box ${type}`;
                authAlert.textContent = message;
            }

            function hideAlert() {
                authAlert.className = "alert-box";
                authAlert.textContent = "";
            }

            authForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                hideAlert();

                const email = emailInput.value.trim();
                const password = passwordInput.value.trim();

                if (!email || !password) return;

                submitBtn.disabled = true;
                submitBtnText.textContent = "Processing...";

                const endpoint = authMode === "signin" ? "/api/user/login" : "/api/user/signup";

                try {
                    const res = await fetch(getApiUrl(endpoint), {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await res.json();

                    if (res.ok && data.success) {
                        if (data.access_token) {
                            localStorage.setItem("sb_access_token", data.access_token);
                        }
                        showAlert("success", data.message || "Authentication successful! Redirecting...");
                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 800);
                    } else {
                        showAlert("danger", data.detail || "Authentication failed.");
                    }
                } catch (err) {
                    showAlert("danger", "Network error: " + err);
                } finally {
                    submitBtn.disabled = false;
                    submitBtnText.textContent = authMode === "signin" ? "Sign In" : "Create Account";
                }
            });

            btnContinueDemo.addEventListener("click", () => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
